<div class="shorten-container">
  <div class="header">
    <h1>URL Shortener</h1>
    <p>Transform long URLs into short, shareable links</p>
  </div>

  <div class="form-container">
    <form (ngSubmit)="onSubmit()" class="shorten-form">
      <div class="input-group">
        <input
          type="text"
          [(ngModel)]="originalUrl"
          name="originalUrl"
          placeholder="Enter your long URL here (e.g., https://example.com/very-long-url)"
          class="url-input"
        />
        <button type="submit" class="shorten-btn">
          <span>Shorten</span>
        </button>
      </div>
    </form>

    <!-- Error message -->
    <div *ngIf="error" class="error-message">
      <span class="error-icon">⚠️</span>
      {{ error }}
    </div>

    <!-- Success result -->
    <div *ngIf="displayShortUrl as shortUrl" class="result-container">
      <h3>Your shortened URL:</h3>
      <div class="result-box">
        <input
          type="text"
          [value]="shortUrl"
          readonly
          class="result-input"
        />
        <button (click)="copyToClipboard()" class="copy-btn">
          <span *ngIf="!copied">📋 Copy</span>
          <span *ngIf="copied">✓ Copied!</span>
        </button>
      </div>
      <div class="result-actions">
        <a [href]="shortUrl" target="_blank" class="test-link">Test Link</a>
        <button (click)="reset()" class="reset-btn">Create Another</button>
      </div>
    </div>
  </div>
</div>
